services:
  - type: web
    name: elibrary-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_API_BASE_URL
        value: https://ai-api.userfacet.com
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: CORS_ORIGINS
        value: '*'
